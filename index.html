<!DOCTYPE html>
<html>
<head>
    <title>My Photo Gallery</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f4f4f4; margin: 0; padding: 20px; }
        .gallery { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; max-width: 900px; margin: auto; }
        img { width: 200px; height: 150px; object-fit: cover; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
    </style>
</head>
<body>
    <h1>My 8 Pictures</h1>
    <div class="gallery">
        <img src="1.jpg" alt="Pic 1">
        <img src="2.jpg" alt="Pic 2">
        <img src="3.jpg" alt="Pic 3">
        <img src="4.jpg" alt="Pic 4">
        <img src="5.jpg" alt="Pic 5">
        <img src="6.jpg" alt="Pic 6">
        <img src="7.jpg" alt="Pic 7">
        <img src="8.jpg" alt="Pic 8">
    </div>
</body>
</html>
